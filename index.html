<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNTER - QR Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <img src="img/bunter.png" alt="BUNTER Logo" class="header-logo">
        </header>

        <!-- Category Navigation -->
        <nav class="category-nav">
            <button class="category-btn active" data-category="burgers">🍔 Burgers</button>
            <button class="category-btn" data-category="fries">🍟 Patates</button>
            <button class="category-btn" data-category="beverages">🥤 İçecekler</button>
            <button class="category-btn" data-category="sauces">🧴 Soslar</button>
            <button class="category-btn" data-category="extras">➕ Ekstralar</button>
            <button class="category-btn" data-category="dessert">🍰 Tatlı</button>
        </nav>

        <!-- Menu Content -->
        <main class="menu-content">
            <div id="menu-container"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
